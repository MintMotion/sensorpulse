<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#2a1236"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#eab308"/>
      <stop offset="0.8" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>
  <!-- pista del indicador (270°) -->
  <path d="M 66.4 189.6 A 87 87 0 1 1 189.6 189.6" fill="none" stroke="#ffffff" stroke-opacity="0.10"
        stroke-width="20" stroke-linecap="round"/>
  <!-- arco de calor con brillo -->
  <path d="M 66.4 189.6 A 87 87 0 1 1 210.4 104.0" fill="none" stroke="url(#heat)" stroke-width="30"
        stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>
  <path d="M 66.4 189.6 A 87 87 0 1 1 210.4 104.0" fill="none" stroke="url(#heat)" stroke-width="20"
        stroke-linecap="round"/>
  <!-- pulso -->
  <path d="M 70 142 L 100 142 L 112 116 L 128 168 L 142 98 L 156 142 L 186 142" fill="none"
        stroke="#22d3ee" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
