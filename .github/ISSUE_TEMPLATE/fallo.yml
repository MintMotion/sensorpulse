name: Algo no funciona / Something doesn't work
description: El programa se cierra, da un error o el panel no muestra nada / The program closes, shows an error or the panel shows nothing
labels: [fallo]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Para poder ayudarte necesitamos el informe del equipo, que es **anónimo** (sin números de serie, nombre del equipo ni usuario).
        En la terminal: `sensorpulse report`, y pega abajo lo que salga.
        Si el fallo es del applet de Cinnamon o de la extensión de GNOME, pega también: `grep -i sensorpulse ~/.xsession-errors | tail -20`

        Thanks for reporting. To help you we need the computer report, which is **anonymous** (no serial numbers, computer name or user).
        In a terminal: `sensorpulse report`, and paste the output below.
        If the problem is the Cinnamon applet or the GNOME extension, also paste: `grep -i sensorpulse ~/.xsession-errors | tail -20`

        Puedes escribir en español o en inglés. / You can write in Spanish or English.
  - type: textarea
    id: que
    attributes:
      label: Qué ha pasado / What happened
      description: Qué esperabas ver y qué has visto. Si hay un mensaje de error, cópialo. / What you expected and what you saw. If there is an error message, copy it.
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema / System
      options:
        - Linux Mint 22.x
        - LMDE 7
        - LMDE 6
        - Ubuntu
        - Debian
        - Otro / Other
    validations:
      required: true
  - type: dropdown
    id: escritorio
    attributes:
      label: Escritorio / Desktop
      options:
        - Cinnamon
        - GNOME
        - KDE Plasma
        - MATE
        - Xfce
        - Otro / Other
  - type: textarea
    id: informe
    attributes:
      label: Informe de SensorPulse (sensorpulse report) / SensorPulse report
      render: markdown
    validations:
      required: true
